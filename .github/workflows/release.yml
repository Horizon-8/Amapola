name: Release Windows

on:
  workflow_dispatch:
  push:
    branches:
      - 'release/**'

permissions:
  contents: write

concurrency:
  group: release-windows
  cancel-in-progress: false

jobs:
  portable:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check release source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid release version' }
          if ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF_NAME -ne "release/$version") { throw 'Release branch must match package version' }
          $main = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha'
          if ($LASTEXITCODE -ne 0 -or $main -ne $env:GITHUB_SHA) { throw 'Publish the release commit on main first' }
          "AMAPOLA_VERSION=$version" >> $env:GITHUB_ENV

      - name: Download verified Node.js runtime
        run: |
          $ErrorActionPreference = 'Stop'
          $nodeVersion = '24.19.0'
          $base = "https://nodejs.org/dist/v$nodeVersion"
          $filename = "node-v$nodeVersion-win-x64.zip"
          $archive = Join-Path $env:RUNNER_TEMP $filename
          Invoke-WebRequest "$base/$filename" -OutFile $archive
          $checksums = (Invoke-WebRequest "$base/SHASUMS256.txt").Content
          $expected = (($checksums -split "`n" | Where-Object { $_.Trim().EndsWith("  $filename") }) -split '\s+')[0]
          if ($expected -notmatch '^[a-f0-9]{64}$' -or (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Official Node checksum mismatch' }
          $unpacked = Join-Path $env:RUNNER_TEMP 'amapola-node'
          Expand-Archive -LiteralPath $archive -DestinationPath $unpacked
          New-Item -ItemType Directory runtime -Force | Out-Null
          Copy-Item -LiteralPath (Join-Path $unpacked "node-v$nodeVersion-win-x64/node.exe") runtime/node.exe
          Copy-Item -LiteralPath (Join-Path $unpacked "node-v$nodeVersion-win-x64/LICENSE") runtime/NODE-LICENSE.txt

      - name: Check syntax and run tests
        run: |
          Get-ChildItem app -Recurse -File | Where-Object { $_.Extension -in '.mjs', '.js' } | ForEach-Object {
            & ./runtime/node.exe --check $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Syntax check failed: $($_.Name)" }
          }
          & ./runtime/node.exe --test
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }

      - name: Build and verify portable ZIP
        run: |
          & ./windows/build.ps1
          $zip = "release/Amapola-$env:AMAPOLA_VERSION-Windows.zip"
          $check = Join-Path $env:RUNNER_TEMP 'amapola-extracted'
          Expand-Archive -LiteralPath $zip -DestinationPath $check
          & (Join-Path $check 'runtime/node.exe') ./windows/verify-portable.mjs $check
          if ($LASTEXITCODE -ne 0) { throw 'Portable package check failed' }
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $zip -Leaf)" | Set-Content -LiteralPath "$zip.sha256" -Encoding ascii

      - name: Publish ZIP and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:AMAPOLA_VERSION"
          $zip = "release/Amapola-$env:AMAPOLA_VERSION-Windows.zip"
          gh release create $tag $zip "$zip.sha256" --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Amapola $env:AMAPOLA_VERSION" --notes-file RELEASE-NOTES.md --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed; existing releases are never overwritten' }
